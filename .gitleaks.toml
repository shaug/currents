title = "Currents public synthetic-only sources"
[extend]
useDefault = true
[[rules]]
id = "currents-account-canary"
description = "Private-account marker, including synthetic qualification canary"
regex = 'CURRENTS_PRIVATE_ACCOUNT=[0-9]{8,}'

# Exact public C2SP Merkle proof from the hash-verified doubleentry snapshot.
# Match both this path and the complete immutable line, never the vendor tree.
