{
  "name": "Vendored doubleentry suite",
  "on": {
    "pull_request": {
      "paths": [
        "vendor/**",
        "patches/**",
        "crates/currents-storage/tests/cur_005.rs",
        "rust-toolchain.toml",
        ".cargo/**",
        ".github/workflows/doubleentry.yml"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "vendor/**",
        "patches/**",
        "crates/currents-storage/tests/cur_005.rs",
        "rust-toolchain.toml",
        ".cargo/**",
        ".github/workflows/doubleentry.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "doubleentry-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "doubleentry": {
      "name": "doubleentry (${{ matrix.os }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 40,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Run the vendored suite (CUR-005)",
          "run": "cargo xtask ticket CUR-005"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "macos-15"
          ]
        }
      }
    }
  }
}
