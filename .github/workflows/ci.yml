{
  "name": "PR checks",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr-checks-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quality": {
      "name": "quality",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "needs": [
        "core",
        "quality-policy",
        "msrv",
        "docs",
        "privacy",
        "doubleentry"
      ],
      "if": "${{ !cancelled() }}",
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Check all gate results",
          "env": {
            "CORE_RESULT": "${{ needs.core.result }}",
            "QUALITY_POLICY_RESULT": "${{ needs.quality-policy.result }}",
            "MSRV_RESULT": "${{ needs.msrv.result }}",
            "DOCS_RESULT": "${{ needs.docs.result }}",
            "PRIVACY_RESULT": "${{ needs.privacy.result }}",
            "DOUBLEENTRY_RESULT": "${{ needs.doubleentry.result }}"
          },
          "run": "status=0\ncheck() {\n  if [ \"$2\" != success ]; then\n    echo \"::error::$1 did not pass (result: ${2:-missing})\"\n    status=1\n  fi\n}\ncheck core \"${CORE_RESULT:-}\"\ncheck quality-policy \"${QUALITY_POLICY_RESULT:-}\"\ncheck msrv \"${MSRV_RESULT:-}\"\ncheck docs \"${DOCS_RESULT:-}\"\ncheck privacy \"${PRIVACY_RESULT:-}\"\ncheck doubleentry \"${DOUBLEENTRY_RESULT:-}\"\nexit \"$status\""
        }
      ]
    },
    "quality-policy": {
      "name": "quality-policy",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Test quality orchestration",
          "run": "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_pr_quality.py"
        },
        {
          "name": "Run quality checks",
          "run": "cargo xtask check quality-ci"
        },
        {
          "name": "Qualify policy counterexamples",
          "run": "cargo xtask ticket CUR-003"
        }
      ]
    },
    "core": {
      "name": "core (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 35,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py --without-cargo-deny\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run core gate",
          "run": "cargo xtask check core",
          "env": {
            "CURRENTS_CI_CORE_PHASES": "1",
            "CURRENTS_TEST_SHARD": "${{ matrix.shard }}/${{ matrix.shards }}"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "include": [
            {
              "os": "ubuntu-24.04",
              "shard": 1,
              "shards": 3
            },
            {
              "os": "ubuntu-24.04",
              "shard": 2,
              "shards": 3
            },
            {
              "os": "ubuntu-24.04",
              "shard": 3,
              "shards": 3
            },
            {
              "os": "macos-15",
              "shard": 1,
              "shards": 2
            },
            {
              "os": "macos-15",
              "shard": 2,
              "shards": 2
            }
          ]
        }
      }
    },
    "msrv": {
      "name": "msrv (${{ matrix.shard }}/3)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py --without-cargo-deny\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run msrv gate",
          "run": "cargo xtask check msrv",
          "env": {
            "CURRENTS_CI_CORE_PHASES": "1",
            "CURRENTS_TEST_SHARD": "${{ matrix.shard }}/3"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "shard": [
            1,
            2,
            3
          ]
        }
      }
    },
    "docs": {
      "name": "docs",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py --without-cargo-deny\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run docs gate",
          "run": "cargo xtask check docs"
        }
      ]
    },
    "privacy": {
      "name": "privacy",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py --without-cargo-deny\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run privacy gate",
          "run": "cargo xtask check privacy"
        }
      ]
    },
    "doubleentry": {
      "name": "doubleentry (${{ matrix.os }}, ${{ matrix.toolchain }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Fingerprint the vendored suite's inputs",
          "id": "inputs",
          "env": {
            "TOOLCHAIN": "${{ matrix.toolchain }}"
          },
          "run": "inputs=\"$(git rev-parse HEAD:vendor HEAD:patches HEAD:rust-toolchain.toml HEAD:.cargo HEAD:crates/currents-storage/tests/cur_005.rs)\"\nfingerprint=\"$(printf '%s\\n' \"$inputs\" | git hash-object --stdin)\"\necho \"key=doubleentry-v1-$RUNNER_OS-$RUNNER_ARCH-$TOOLCHAIN-$fingerprint\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Look up an earlier pass with the same inputs",
          "id": "earlier",
          "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "key": "${{ steps.inputs.outputs.key }}",
            "path": "target/doubleentry-passed",
            "lookup-only": true
          }
        },
        {
          "name": "Install exact Rust toolchain",
          "if": "steps.earlier.outputs.cache-hit != 'true'",
          "env": {
            "TOOLCHAIN": "${{ matrix.toolchain }}"
          },
          "run": "rustup toolchain install \"$TOOLCHAIN\" --profile minimal"
        },
        {
          "name": "Run the vendored suite (CUR-005)",
          "if": "steps.earlier.outputs.cache-hit != 'true'",
          "env": {
            "TOOLCHAIN": "${{ matrix.toolchain }}",
            "KEY": "${{ steps.inputs.outputs.key }}"
          },
          "run": "rustup run \"$TOOLCHAIN\" cargo xtask ticket CUR-005\nmkdir -p target\necho \"$KEY\" > target/doubleentry-passed"
        },
        {
          "name": "Record the pass",
          "if": "steps.earlier.outputs.cache-hit != 'true'",
          "uses": "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "key": "${{ steps.inputs.outputs.key }}",
            "path": "target/doubleentry-passed"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "include": [
            {
              "os": "ubuntu-24.04",
              "toolchain": "1.99.0"
            },
            {
              "os": "macos-15",
              "toolchain": "1.99.0"
            },
            {
              "os": "ubuntu-24.04",
              "toolchain": "1.94.0"
            }
          ]
        }
      }
    }
  }
}
