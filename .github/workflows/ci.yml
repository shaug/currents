{
  "name": "PR checks",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr-checks-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quality": {
      "name": "quality",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "needs": [
        "core",
        "quality-policy",
        "msrv",
        "docs",
        "privacy"
      ],
      "if": "${{ !cancelled() }}",
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Check all gate results",
          "env": {
            "CORE_RESULT": "${{ needs.core.result }}",
            "QUALITY_POLICY_RESULT": "${{ needs.quality-policy.result }}",
            "MSRV_RESULT": "${{ needs.msrv.result }}",
            "DOCS_RESULT": "${{ needs.docs.result }}",
            "PRIVACY_RESULT": "${{ needs.privacy.result }}"
          },
          "run": "status=0\ncheck() {\n  if [ \"$2\" != success ]; then\n    echo \"::error::$1 did not pass (result: ${2:-missing})\"\n    status=1\n  fi\n}\ncheck core \"${CORE_RESULT:-}\"\ncheck quality-policy \"${QUALITY_POLICY_RESULT:-}\"\ncheck msrv \"${MSRV_RESULT:-}\"\ncheck docs \"${DOCS_RESULT:-}\"\ncheck privacy \"${PRIVACY_RESULT:-}\"\nexit \"$status\""
        }
      ]
    },
    "quality-policy": {
      "name": "quality-policy",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Test PR quality orchestration",
          "if": "${{ github.event_name == 'pull_request' }}",
          "run": "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_pr_quality.py"
        },
        {
          "name": "Run PR quality checks",
          "if": "${{ github.event_name == 'pull_request' }}",
          "run": "cargo xtask check quality-ci"
        },
        {
          "name": "Run full quality gate",
          "if": "${{ github.event_name != 'pull_request' }}",
          "run": "cargo xtask check quality"
        },
        {
          "name": "Qualify policy counterexamples",
          "run": "cargo xtask ticket CUR-003"
        }
      ]
    },
    "core": {
      "name": "core (${{ matrix.os }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 40,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run core gate",
          "run": "cargo xtask check core",
          "env": {
            "CURRENTS_MACOS_CORE_PHASES": "${{ matrix.os == 'macos-15' && '1' || '' }}"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "macos-15"
          ]
        }
      }
    },
    "msrv": {
      "name": "msrv",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run msrv gate",
          "run": "cargo xtask check msrv"
        }
      ]
    },
    "docs": {
      "name": "docs",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run docs gate",
          "run": "cargo xtask check docs"
        }
      ]
    },
    "privacy": {
      "name": "privacy",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "name": "Checkout v7.0.1 (immutable upstream commit)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact checkout",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Install exact Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup default 1.99.0"
        },
        {
          "name": "Install checksum-pinned policy tools",
          "run": "python3 tools/install-ci-tools.py\necho \"CURRENTS_TOOLS_BIN=$PWD/target/ci-tools/bin\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Install exact candidate MSRV",
          "run": "rustup toolchain install 1.94.0 --profile minimal\necho \"CURRENTS_MSRV_BIN=$(dirname \"$(rustup which --toolchain 1.94.0 cargo)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Run privacy gate",
          "run": "cargo xtask check privacy"
        }
      ]
    }
  }
}
