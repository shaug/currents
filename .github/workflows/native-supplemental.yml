{
  "name": "Native supplemental observations",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {
      "paths": [
        "native/**",
        "include/**",
        "tools/native-supplemental.py",
        "tools/test_native_supplemental.py",
        ".github/workflows/native-supplemental.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "native-supplemental-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "observe": {
      "name": "Patched macOS 15 / iOS 18 observations (not full qualification)",
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_16.4.app/Contents/Developer",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "name": "Checkout exact workflow candidate",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Offline collector counterexamples",
          "run": "python3 -m unittest discover -s tools -p test_native_supplemental.py"
        },
        {
          "name": "Collect actual native observations",
          "run": "python3 tools/native-supplemental.py"
        },
        {
          "name": "Preserve raw observations even on failure",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "native-supplemental-${{ github.sha }}-${{ github.run_attempt }}",
            "path": "target/native-supplemental/*.json\ntarget/native-supplemental/*.log\ntarget/native-supplemental/*.xcresult/",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
