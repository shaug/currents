{
  "name": "Native partial evidence",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {
      "paths": [
        "native/**",
        "include/**",
        "tools/native-supplemental.py",
        "tools/test_native_supplemental.py",
        ".github/workflows/native-supplemental.yml",
        "xtask/src/native.rs",
        "xtask/src/native/**",
        "tools/versions.lock.json",
        "tools/native-canonical.py",
        "tools/test_native_canonical.py"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "native-supplemental-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "observe": {
      "name": "Patched macOS 15 / iOS 18 partial evidence (not full qualification)",
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_16.4.app/Contents/Developer",
        "PYTHONDONTWRITEBYTECODE": "1",
        "CURRENTS_CANDIDATE_SHA": "${{ github.event.pull_request.head.sha || github.sha }}"
      },
      "steps": [
        {
          "name": "Checkout exact workflow candidate",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}"
          }
        },
        {
          "name": "Offline collector counterexamples",
          "run": "python3 -m unittest discover -s tools -p test_native_supplemental.py\npython3 -m unittest discover -s tools -p test_native_canonical.py"
        },
        {
          "name": "Install exact Rust toolchain for canonical partial evidence",
          "run": "rustup toolchain install 1.99.0 --profile minimal\nrustup default 1.99.0"
        },
        {
          "name": "Collect canonical minimum and simulator roles (not full qualification)",
          "run": "python3 tools/native-canonical.py",
          "env": {
            "CARGO_BUILD_JOBS": "2",
            "CARGO_INCREMENTAL": "0"
          }
        },
        {
          "name": "Preserve raw observations even on failure",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "native-partial-${{ github.sha }}-${{ github.run_attempt }}",
            "path": "target/native-canonical/\ntarget/qualification/native-*/evidence.json\ntarget/qualification/native-*/*.xcresult/",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
