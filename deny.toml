[advisories]
version = 2
[licenses]
version = 2
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL", "CC0-1.0", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0"]
[[licenses.exceptions]]
name = "sqlcipher-src"
version = "=420.0.0"
allow = ["blessing", "WTFPL"]
[licenses.private]
# Private workspace application licensing remains a release-owner decision.
ignore = true
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/hupe1980/doubleentry"]
