[package]
name = "currents-cipher"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sqlx.workspace = true
sqlx-core.workspace = true
sqlx-sqlite.workspace = true
zeroize.workspace = true
secrecy.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher"] }

[target.'cfg(target_os = "linux")'.dependencies]
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tokio.workspace = true
